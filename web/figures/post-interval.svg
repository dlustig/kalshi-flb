<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140" role="img" aria-labelledby="post-interval-title post-interval-description"><title id="post-interval-title">Post-publication maker net interval</title><desc id="post-interval-description">Post maker net estimate +0.81 cents, 95 percent interval -0.03 to +1.59, on a shared -1 to 4 cent scale.</desc><style>text{font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#253b30}line{vector-effect:non-scaling-stroke}.interval-axis{stroke:#657064;stroke-width:1}.interval-zero{stroke:#98a38e;stroke-width:1;stroke-dasharray:3 3}.interval-ci{stroke:#2e6652;stroke-width:3}.interval-estimate{fill:#ac5035}.interval-value{font-family:Georgia,'Times New Roman',serif;font-size:18px}.interval-unavailable{fill:#657064;font-style:italic}</style><line class="interval-axis" x1="50" y1="75" x2="550" y2="75"/><line class="interval-zero" x1="150.0" y1="38" x2="150.0" y2="100"/><text x="50" y="120">-1¢</text><text x="550" y="120" text-anchor="end">+4¢</text><line class="interval-ci" x1="147.2" y1="68" x2="309.5" y2="68"/><circle class="interval-estimate" cx="230.9" cy="68" r="7"/><text class="interval-value" x="230.9" y="28" text-anchor="middle">+0.81¢</text></svg>