<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140" role="img" aria-labelledby="pre-interval-title pre-interval-description"><title id="pre-interval-title">Pre-publication maker net interval</title><desc id="pre-interval-description">Pre maker net estimate +2.13 cents, 95 percent interval +0.40 to +3.59, on a shared -1 to 4 cent scale.</desc><style>text{font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#253b30}line{vector-effect:non-scaling-stroke}.interval-axis{stroke:#657064;stroke-width:1}.interval-zero{stroke:#98a38e;stroke-width:1;stroke-dasharray:3 3}.interval-ci{stroke:#2e6652;stroke-width:3}.interval-estimate{fill:#ac5035}.interval-value{font-family:Georgia,'Times New Roman',serif;font-size:18px}.interval-unavailable{fill:#657064;font-style:italic}</style><line class="interval-axis" x1="50" y1="75" x2="550" y2="75"/><line class="interval-zero" x1="150.0" y1="38" x2="150.0" y2="100"/><text x="50" y="120">-1¢</text><text x="550" y="120" text-anchor="end">+4¢</text><line class="interval-ci" x1="190.3" y1="68" x2="508.7" y2="68"/><circle class="interval-estimate" cx="362.6" cy="68" r="7"/><text class="interval-value" x="362.6" y="28" text-anchor="middle">+2.13¢</text></svg>