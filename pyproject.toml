[project]
name = "kalshi-flb"
version = "0.1.0"
description = "Kalshi favorite-longshot bias verifier (read-only)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Dan Lustig" }]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "pytz>=2026.2",       # not imported directly; DuckDB needs it to convert TIMESTAMPTZ -> pandas
    "tabulate>=0.10.0",   # pandas DataFrame.to_markdown() backend (report tables)
]

[project.scripts]
kalshi-flb = "kalshi_flb.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kalshi_flb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
