name: Deploy exhibit to GitHub Pages

# Publishes to the existing GitHub Pages destination confirmed by the owner.
# Builds the same portable snapshot bundle; never opens the research database.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/build_exhibit.py"
      - "analysis/out/**"
      - "DESIGN.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the frozen research exhibit
        run: python3 scripts/build_exhibit.py --out dist/site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - id: deployment
        uses: actions/deploy-pages@v4
